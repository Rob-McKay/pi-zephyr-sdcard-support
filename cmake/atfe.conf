# Arm Toolchain for Embedded is LLVM-only: link with lld and compiler-rt
# (it has neither GNU ld nor libgcc). Added by cmake/toolchain.cmake.
CONFIG_LLVM_USE_LLD=y
CONFIG_COMPILER_RT_RTLIB=y

# Run-time buffer overflow checks: _FORTIFY_SOURCE=2 (the module's
# CMakeLists.txt supplies the define, which Zephyr omits for clang).
CONFIG_FORTIFY_SOURCE_RUN_TIME=y

# lld leaves an empty .last_section unallocated at address 0, which makes
# _flash_used, the image size in the arm64 boot header that the Pi's GPU
# firmware reads, negative. A word in the section keeps it in place.
CONFIG_LINKER_LAST_SECTION_ID=y
