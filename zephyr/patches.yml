# Patches to Zephyr, applied with "west patch apply" after "west update"
# (the Dockerfile does both). Each one waits for an upstream pull request;
# drop it once the west.yml pin includes the merged change. See
# docs/UPSTREAM.md.
patches:
  # BCM283x SDHost driver for the microSD slot (rpi_zero_2w upstream; the
  # rpi_3a_plus board here enables it). Approved, milestone v4.6.0. Applies
  # unchanged on the pinned commit. The driver under test.
  - path: zephyr/pr110196-bcm2835-sdhost.patch
    sha256sum: 1df486cb4bb4c51d3d6fec5f1eaf88247d0332259dc1605384fe022e47ce8ca6
    module: zephyr
    author: Jonathan E. Peace
    email: jep@alphabetiq.com
    date: 2026-05-26
    upstreamable: true
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/110196
    merge-status: false
  # Review finding 12 (docs/reviews/pr110196-sdhost-review.md), found on a
  # real Pi 3A+: an open-ended read (CMD18) sometimes runs on into the
  # block after the last one asked for before the driver stops the card;
  # the FIFO fills, the controller stops the bus clock, and the read and
  # every later request fail until a re-init (about 12 s). Now CMD12 is
  # sent at once and the FIFO emptied, the extra words discarded, until
  # the command and the data phase are done; a failed open-ended read is
  # stopped the same way (finding 2, reads). On top of PR #110196. Not
  # yet sent upstream.
  - path: zephyr/sdhost-stop-open-read.patch
    sha256sum: f8e44b9d4a07fa619d22ea55f30ebd38da0a74d5cb2ad2e7a2c06ae77b3b1ce7
    module: zephyr
    author: Claude
    email: noreply@anthropic.com
    date: 2026-10-20
    upstreamable: true
    merge-status: false
  # Review finding 1, seen on a real Pi 3A+ (tenth run, a 2 GB card): the
  # driver waited only 100 ms for the card's busy after a write's CMD12,
  # and only the SD stack's 200 ms command timeout for other busy (R1b)
  # commands such as CMD38 erase, so slow but spec-compliant cards had
  # writes and erases reported as failed although they succeeded. Now at
  # least 500 ms (the spec's SDXC write busy, and its recommended minimum;
  # the data timeout after a write), and 10 s for an erase. On top of
  # sdhost-stop-open-read. Tested by tests/sdhost_review. Not yet sent
  # upstream.
  - path: zephyr/sdhost-busy-timeouts.patch
    sha256sum: b010c4f5f673173743dfeafe795a338136af3b9da3b67504c08c95d01edd9c64
    module: zephyr
    author: Claude
    email: noreply@anthropic.com
    date: 2026-10-21
    upstreamable: true
    merge-status: false
  # The firmware driver gave the VideoCore the shared buffer's ARM
  # physical address. On BCM2837 the VideoCore must read ARM RAM through
  # the uncached alias in the soc node's dma-ranges (0xC0000000), as Linux
  # does; on a real Pi 3A+ the firmware never answered. Also waits up to
  # 1 s for a reply, as Linux, instead of 100 ms. The tests read the real
  # core clock through it. Not yet sent upstream.
  - path: zephyr/rpi-fw-bus-address.patch
    sha256sum: bcb06393d91a3a0812e4863c08ad09187fc2a01f1355e65253ae21a3c0260d82
    module: zephyr
    author: Claude
    email: noreply@anthropic.com
    date: 2026-10-18
    upstreamable: true
    merge-status: false
  # Zephyr's SD stack checked reads and writes with
  # start_block + num_blocks > block_count in 32 bits, which wraps for a
  # range ending past block 0xffffffff, so the request went to the card;
  # only the card's out-of-range error stopped it. Now the same
  # overflow-aware check as card_erase_blocks(). Not the SDHost driver's
  # bug: still in Zephyr main on 21 October 2026. Tested by tests/sd_bounds
  # and tests/sdcard_hw. Sent upstream as #123216.
  - path: zephyr/sd-ops-bounds-overflow.patch
    sha256sum: 5fea352cfe0e17201cc87a5238917345fcdb107fd1c79fdf9df3438d151abd31
    module: zephyr
    author: Claude
    email: noreply@anthropic.com
    date: 2026-10-21
    upstreamable: true
    merge-pr: https://github.com/zephyrproject-rtos/zephyr/pull/123216
    merge-status: false
  # Zephyr's SD stack switched a card to a 4-bit bus only after switching
  # it to High Speed (sdmmc_init_hs()), so a card without High Speed stayed
  # on one data line, at a quarter of the speed: seen on a 2 GB card on a
  # real Pi 3A+ (ninth run, 3.1 MB/s). Every SD memory card supports 4 bits
  # (SD Physical Layer Simplified Specification v9.10, section 5.6,
  # SD_BUS_WIDTHS). Now the bus is widened either way. Still in Zephyr main
  # on 21 October 2026. Tested by tests/sd_bus_width. Not yet sent upstream.
  - path: zephyr/sdmmc-4bit-without-hs.patch
    sha256sum: 10e59f54d95227fcfc9f8df8a13541f99a8c2fd092f8cf14fde1f97d4a932cbf
    module: zephyr
    author: Claude
    email: noreply@anthropic.com
    date: 2026-10-21
    upstreamable: true
    merge-status: false
