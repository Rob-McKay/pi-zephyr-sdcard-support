# West manifest for the BCM283x SD card work.
#
# This repository is the manifest ("T2" topology): `west init -l` from here
# fetches the pinned Zephyr, and no modules: the tests need none.
#
# The pin is the v4.5.0 release, the first with BCM2710 (Raspberry Pi 3 /
# Zero 2 W) SoC support. Every patch in zephyr/patches.yml applies to it.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      # No module imports; but Zephyr's west extensions ("west build",
      # "west patch") still have to be named.
      west-commands: scripts/west-commands.yml
      import: false

  self:
    path: sdcard
