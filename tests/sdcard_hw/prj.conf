CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
# Preemptible test thread, time slicing: the concurrency suite runs
# several threads at the test thread's priority.
CONFIG_ZTEST_THREAD_PRIORITY=1
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1
CONFIG_TIMESLICE_PRIORITY=0
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# The card through Zephyr's disk access API ("SD"), as an application or a
# file system would use it.
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
# crc32_ieee() for the boot partition's files.
CONFIG_CRC=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
