# SPDX-License-Identifier: Apache-2.0
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
# The test thread must be preemptible to show starvation (finding 6) and
# concurrent requests (finding 9); time slicing lets equal priorities
# interleave.
CONFIG_ZTEST_THREAD_PRIORITY=1
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1
CONFIG_TIMESLICE_PRIORITY=0
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# For CONFIG_SDHC_LOG_LEVEL and the SDHC types; no SDHC device is built
# (the drivers under test are compiled into the test itself).
CONFIG_SDHC=y
CONFIG_LOG=y
CONFIG_PINCTRL_BCM2711=n
