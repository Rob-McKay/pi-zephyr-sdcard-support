CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
# The test thread must be preemptible to show starvation (finding 6) and
# concurrent requests (finding 9); time slicing lets equal priorities
# interleave.
CONFIG_ZTEST_THREAD_PRIORITY=1
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1
CONFIG_TIMESLICE_PRIORITY=0
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
# The real driver, through the SD stack (card init) and directly (raw
# requests, so a test sees exactly what the driver returns).
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
